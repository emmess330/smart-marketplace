name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + ML tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace_user
          POSTGRES_PASSWORD: marketplace_pass
          POSTGRES_DB: marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace_user -d marketplace"
          --health-interval 5s --health-timeout 5s --health-retries 20
      elasticsearch:
        image: elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      # The tests look for ml/.venv and skip the ML services without it.
      - name: Install ML dependencies
        run: |
          python -m venv ml/.venv
          ml/.venv/bin/pip install --upgrade pip
          ml/.venv/bin/pip install -r ml/requirements.txt

      - name: Write backend/.env
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          cp .env.example backend/.env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" backend/.env
          sed -i "s|^ADMIN_KEY=.*|ADMIN_KEY=$(openssl rand -hex 32)|" backend/.env
          sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|" backend/.env
          # Stripe checkout/refund tests run only with a test-mode key in the
          # STRIPE_TEST_SECRET_KEY repo secret (never available to fork PRs).
          if [[ "$STRIPE_TEST_SECRET_KEY" == sk_test_* ]]; then
            sed -i "s|^STRIPE_SECRET_KEY=.*|STRIPE_SECRET_KEY=$STRIPE_TEST_SECRET_KEY|" backend/.env
            echo "Stripe test key configured"
          else
            sed -i "s|^STRIPE_SECRET_KEY=.*|STRIPE_SECRET_KEY=|" backend/.env
            echo "::notice::STRIPE_TEST_SECRET_KEY secret not set; Stripe tests will be skipped"
          fi

      - name: Apply migrations
        run: ./database/apply-migrations.sh

      - name: Type-check services
        working-directory: backend
        run: deno check auth/main.ts products/main.ts orders/main.ts users/main.ts search/main.ts

      - name: Run tests
        working-directory: backend
        run: deno task test

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: backend/tests/.logs/
          # upload-artifact skips dot-directories unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm run build
