# Exact versions of every ML package (direct and indirect), installed by CI
# and the setup instructions:
#     pip install -r requirements.lock
#
# requirements.txt lists the direct dependencies with minimum versions;
# edit that, then regenerate this file in a fresh Python 3.12 venv:
#     python3.12 -m venv /tmp/lockenv
#     /tmp/lockenv/bin/pip install -r requirements.txt
#     /tmp/lockenv/bin/pip freeze --all --exclude pip --exclude setuptools --exclude wheel
# re-add the platform marker on uvloop below, run the test suite, commit both.
#
# Why pinned: requirements.txt only sets minimums, so fresh installs pick up
# whatever is newest. SQLAlchemy 2.1 silently changed the default Postgres
# driver and broke every ML database call in CI.
